plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tororang'
version = '0.0.1-SNAPSHOT'
description = 'review'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    // web-application-type: none 으로 서버는 띄우지 않지만, RestClient/Jackson 및
    // 향후 web 프로파일(Webhook/대시보드) 전환을 위해 starter-web을 올려둔다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    // RestTemplate 기본 팩토리(SimpleClientHttpRequestFactory/HttpURLConnection)는 PATCH를
    // 안정적으로 지원하지 않는다. GitHub API의 코멘트 갱신(PATCH)에 필요.
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
